name: Synthetic customer acceptance
on:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: 'Synthetic soak duration (0–3600 seconds)'
        type: string
        default: '600'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt -r requirements-sdk.txt
      - run: python scripts/build_sdks.py
      - name: Build an isolated local image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t pliqra:rc3-acceptance .
      - name: Exercise onboarding, quota, fleet, streaming, load, soak and recovery
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: python scripts/customer_acceptance.py --state work/customer-ci --soak-seconds "$SOAK_SECONDS" --keep
      - name: Invoke from independently installed Python and npm applications
        run: python scripts/check_customer_clients.py work/customer-ci
      - name: Verify official native clients against synthetic upstreams
        run: |
          python -m venv work/official-client-env
          work/official-client-env/bin/python -m pip install -r requirements-acceptance.txt
          work/official-client-env/bin/python tests/acceptance/official_clients.py work/customer-ci
      - name: Remove only the owned disposable lab
        if: always()
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          state=Path('work/customer-ci')
          if (state/'lab.json').exists():
              project=json.loads((state/'lab.json').read_text())['project']
              assert project.startswith('pliqra-accept-')
              subprocess.run(['docker','compose','--project-name',project,'--env-file',str(state/'fixture.env'),'-f','tests/acceptance/compose.yaml','down','--volumes'],check=True)
          PY
      - name: Retain only public synthetic results, never credentials or fixture keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-customer-results
          path: |
            work/customer-ci/report.json
            work/customer-ci/installed-clients.json
            work/customer-ci/official-clients.json
          if-no-files-found: warn
          retention-days: 14
