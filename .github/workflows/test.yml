name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q pliqra sdk examples
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t pliqra:ci .
      - name: Smoke test a fresh single-container workspace
        run: |
          set -eu
          docker run -d --name pliqra-ci -p 127.0.0.1:8088:8080 pliqra:ci
          trap 'docker logs pliqra-ci; docker rm -fv pliqra-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8088/healthz; then
              curl --fail --silent http://localhost:8088/.well-known/pliqra
              exit 0
            fi
            sleep 1
          done
          exit 1
