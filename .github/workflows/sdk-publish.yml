name: Publish SDKs
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published gateway tag containing tested SDK assets'
        required: true
        type: string
        default: v2.1.0-rc.3
      registry:
        description: 'Destination registry'
        required: true
        type: choice
        options: [pypi, npm, both]
permissions:
  contents: read
concurrency:
  group: sdk-publish-${{ inputs.release_tag }}-${{ inputs.registry }}
  cancel-in-progress: false
jobs:
  pypi:
    if: inputs.registry == 'pypi' || inputs.registry == 'both'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Fetch and verify the already-tested release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/fetch_sdk_release.py "$RELEASE_TAG"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/publish/python/
          attestations: true
  npm:
    if: inputs.registry == 'npm' || inputs.registry == 'both'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Fetch and verify the already-tested release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/fetch_sdk_release.py "$RELEASE_TAG"
      - name: Publish through the configured npm trusted publisher
        run: npm publish dist/publish/npm/*.tgz --access public --tag next --provenance --ignore-scripts
